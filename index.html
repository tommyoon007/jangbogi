<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장보기</title>
<meta name="description" content="영수증으로 장보기 기록, 가격 비교, 기간별 지출을 한눈에 보는 장보기 수첩">
<meta name="theme-color" content="#2f7d4d">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="장보기">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="appbar" id="appbar">
  <div class="appbar-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8h12l-1.2 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8Z"/>
          <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>장보기</h1>
        <p id="barSub">이번 달 장보기 기록</p>
      </div>
    </div>
    <button class="iconbtn" id="btnMore" type="button" aria-label="더보기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">
  <section id="view-list" class="view" aria-label="장볼목록" hidden></section>
  <section id="view-price" class="view" aria-label="가격비교" hidden></section>
  <section id="view-period" class="view" aria-label="기간정리" hidden></section>
  <section id="view-receipts" class="view" aria-label="영수증" hidden></section>
</main>

<nav class="tabbar" aria-label="화면 고르기">
  <button class="tab" type="button" data-tab="list" aria-current="page">
    <span class="tab-ico">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5.5h6a1 1 0 0 1 1 1V20l-4-2.2L8 20V6.5a1 1 0 0 1 1-1Z"/>
        <path d="M10.5 9.5h3"/><path d="M10.5 13h3"/>
      </svg>
      <span class="badge" id="tabBadge" hidden></span>
    </span>
    <span class="tab-label">장볼목록</span>
  </button>
  <button class="tab" type="button" data-tab="price">
    <span class="tab-ico">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19h16"/><path d="M7 19v-6"/><path d="M12 19V6"/><path d="M17 19v-9"/>
      </svg>
    </span>
    <span class="tab-label">가격비교</span>
  </button>
  <button class="tab" type="button" data-tab="period">
    <span class="tab-ico">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/>
        <path d="M4 10h16"/><path d="M8.5 3.5v3.5"/><path d="M15.5 3.5v3.5"/>
      </svg>
    </span>
    <span class="tab-label">기간정리</span>
  </button>
  <button class="tab" type="button" data-tab="receipts">
    <span class="tab-ico">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3.5h12v17l-2-1.6-2 1.6-2-1.6-2 1.6-2-1.6-2 1.6Z"/>
        <path d="M9 8.5h6"/><path d="M9 12.5h6"/>
      </svg>
    </span>
    <span class="tab-label">영수증</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" data-act="closeSheet"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript>
  <p style="padding:24px;text-align:center">이 앱은 자바스크립트가 켜져 있어야 열립니다.</p>
</noscript>

<script src="app.js"></script>
</body>
</html>
